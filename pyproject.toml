[project]
name = "shab-train-clock"
version = "0.1.0"
description = "Wall-mounted tablet dashboard server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.25",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "pydantic>=2.9",
    "astral>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shab_train_clock"]
